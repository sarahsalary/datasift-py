# Ruff configuration for datasift-py
# https://docs.astral.sh/ruff/

target-version = "py38"
line-length = 100
src = ["src", "tests"]

[lint]
# Rules that catch real bugs and basic style issues.
# Opinionated / py3.9+-only rules (PTH, UP006/007/045, PLC0415, SIM*, TC*, ARG*)
# are intentionally disabled: they conflict with the project's py3.8 support
# and its deliberate use of os.path and typing.Dict/List/Optional.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (unused imports, undefined names, ...)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

ignore = [
    "E501",     # line length is enforced by the formatter
    "E741",     # ambiguous single-letter names are allowed in small scopes
    "RUF001",   # ambiguous unicode characters in strings (e.g. "x")
    "RUF002",   # ambiguous unicode characters in docstrings
    "RUF003",   # ambiguous unicode characters in comments
]

[lint.per-file-ignores]
# Asserting a blind exception is acceptable in tests.
"tests/*" = ["B017"]