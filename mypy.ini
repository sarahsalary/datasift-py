[mypy]
# Pragmatic mypy configuration for datasift-py.
# The project is annotated progressively; strict flags are opt-in and will be
# tightened in future releases. The goal here is to catch real errors without
# blocking development on annotation-only warnings.
python_version = 3.11
files = src/datasift
ignore_missing_imports = True
show_error_codes = True
pretty = True

# Do not require annotations everywhere.
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_subclassing_any = False
disallow_untyped_decorators = False

# Keep a couple of useful warnings, silence the rest.
no_implicit_optional = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_return_any = False
warn_unreachable = False
strict_equality = False

# Per-module relaxation for legacy / dynamic code where strict typing
# would require larger refactors. These modules are covered by the test suite.
[mypy-datasift.formats.toml_io]
disable_error_code = assignment, var-annotated

[mypy-datasift.schema_loader]
disable_error_code = misc

[mypy-datasift.formats.xml_io]
disable_error_code = assignment

[mypy-datasift.data]
disable_error_code = arg-type, call-overload

[mypy-datasift.cli]
disable_error_code = arg-type