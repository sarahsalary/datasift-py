name: 🐛 Bug Report
description: Report a bug or unexpected behavior in datasift-py
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest version of datasift-py.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
      placeholder: |
        from datasift import Data
        data = Data([{"name": "Alice", "age": 30}])
        result = data.filter(age__gt=25).to_list()
        print(result)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: datasift-py version
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Fluent API (Data)
        - Streaming API (Stream)
        - Query language
        - Schema validation
        - Format: JSON
        - Format: JSONL
        - Format: YAML
        - Format: TOML
        - Format: CSV
        - Format: XML
        - CLI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false