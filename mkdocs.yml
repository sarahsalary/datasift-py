site_name: datasift-py
site_description: Python-native fluent API for data conversion, querying, manipulation, and validation.
site_url: https://sarahsalary.github.io/datasift-py/
repo_url: https://github.com/sarahsalary/datasift-py
repo_name: sarahsalary/datasift-py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Fluent API: fluent-api.md
  - Query Language: query-language.md
  - CLI: cli.md
  - Formats: formats.md
  - Streaming: streaming.md
  - Schema Validation: schema.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true